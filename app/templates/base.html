<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Support Team Dashboard - Real-time issue tracking and KPIs">
    <title>{% block title %}Support Team Dashboard{% endblock %}</title>

    <!-- Dark Theme CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-theme.css') }}">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">
                <span class="logo-icon">📊</span>
                Support Team Dashboard
            </h1>
            <nav class="nav">
                <a href="{{ url_for('dashboard.index') }}" class="nav-link active">Dashboard</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="footer-text">
                &copy; 2025 Support Team Dashboard |
                <span id="last-updated">Last updated: <span class="timestamp">--:--</span></span>
            </p>
        </div>
    </footer>

    <!-- Custom JavaScript -->
    {% block scripts %}{% endblock %}
</body>
</html>
