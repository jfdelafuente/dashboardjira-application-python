version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-dashboard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashboard_user} -d ${POSTGRES_DB:-support_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard-network

  # Redis Cache (Optional - for future caching)
  redis:
    image: redis:7-alpine
    container_name: dashboard-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme_in_production}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard-network

  # Flask Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Flask Configuration
      FLASK_APP: run.py
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret-key-in-production}

      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard_user}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-support_dashboard}

      # Jira Configuration
      JIRA_SERVER: ${JIRA_SERVER:-https://your-company.atlassian.net}
      JIRA_EMAIL: ${JIRA_EMAIL:-your-email@example.com}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-your-token-here}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-SUP}
      USE_MOCK_DATA: ${USE_MOCK_DATA:-true}

      # Redis Configuration (for future caching)
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Mount logs directory for persistent logs
      - ./logs:/app/logs
      # Mount instance directory for SQLite (if needed)
      - ./instance:/app/instance
    ports:
      - "5000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/kpis"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dashboard-network

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: dashboard-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./app/static:/usr/share/nginx/html/static:ro
    networks:
      - dashboard-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  dashboard-network:
    driver: bridge
