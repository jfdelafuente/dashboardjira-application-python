name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements/*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/test.txt

    - name: Run linting (flake8)
      run: |
        flake8 app/ --max-line-length=100 --exclude=__pycache__,migrations

    - name: Check code formatting (black)
      run: |
        black --check app/ tests/ scripts/

    - name: Run type checking (mypy)
      continue-on-error: true  # Don't fail build on type errors
      run: |
        mypy app/services/kpi_service.py app/services/chart_service.py --ignore-missing-imports

    - name: Run tests with coverage
      env:
        USE_MOCK_DATA: 'true'
        FLASK_ENV: testing
        SECRET_KEY: test-secret-key-for-ci
      run: |
        pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        verbose: true

    - name: Verify test coverage threshold
      run: |
        coverage report --fail-under=80

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Check for security vulnerabilities (safety)
      continue-on-error: true  # Don't fail build
      run: |
        safety check --file requirements/base.txt

    - name: Run security linter (bandit)
      continue-on-error: true  # Don't fail build
      run: |
        bandit -r app/ -ll

  build:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/base.txt

    - name: Test application startup
      env:
        USE_MOCK_DATA: 'true'
        FLASK_ENV: testing
        SECRET_KEY: test-secret-key-for-ci
      run: |
        python -c "from app import create_app; app = create_app(); print('Application created successfully')"

    - name: Run database migrations (dry run)
      env:
        USE_MOCK_DATA: 'true'
        FLASK_ENV: testing
        SECRET_KEY: test-secret-key-for-ci
      run: |
        flask db upgrade
        echo "Database migrations successful"
